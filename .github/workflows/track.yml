name: stock-tracker

on:
  schedule:
    # Tijden in UTC. Belgie zomertijd = UTC+2, dus 22:00 UTC = middernacht BE.
    - cron: "50 21 * * *"           # 23:50 BE
    - cron: "0,10,20,30 22 * * *"   # 00:00, 00:10, 00:20, 00:30 BE (rond de drop)
    - cron: "0 6,12,18 * * *"       # 08:00, 14:00, 20:00 BE (overdag)
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur een testmelding in plaats van te scannen"
        type: boolean
        default: false

concurrency:
  group: stock-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node tracker.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPER_URL_TEMPLATE: ${{ secrets.SCRAPER_URL_TEMPLATE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_COOLDOWN_MIN: ${{ secrets.NOTIFY_COOLDOWN_MIN }}
          TEST_NOTIFICATION: ${{ inputs.test }}
